version: '3.7'

services:
  postgres:
    image: postgres:9.6
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    logging:
      options:
        max-size: 10m
        max-file: "3"

  webserver:
    image: puckel/docker-airflow:1.10.9
    restart: always
    depends_on:
      - postgres
    environment:
      - LOAD_EX=n
      - EXECUTOR=Local
      - STRIPE_API_KEY
      - MAILCHIMP_API_KEY
      - MAILCHIMP_DC
      - MAILCHIMP_LIST_ID
      - MAILCHIMP_FROM_NAME
      - MAILCHIMP_REPLY_TO
      - MANDRILL_API_KEY
      - MANDRILL_FROM_EMAIL
      - MANDRILL_TO_EMAIL
      - STRIPE_CUSTOMER_ID
      - STRIPE_PORTAL_CONFIG_ID
      - STRIPE_PORTAL_RETURN_URL
    env_file:
      - .env
    logging:
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - ./dags:/usr/local/airflow/dags
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "[ -f /usr/local/airflow/airflow-webserver.pid ]"]
      interval: 30s
      timeout: 30s
      retries: 3

  httpbin:
    image: kennethreitz/httpbin
    ports:
      - "8081:80"
